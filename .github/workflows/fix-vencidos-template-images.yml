name: Fix vencidos template images

on:
  push:
    paths:
      - '.github/workflows/fix-vencidos-template-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch expired clients message image flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/vencidos.tsx')
          s = p.read_text()

          old = """    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    setIsMessageOpen(false);"""
          new = """    const bridge = (window as any).OwerAppsExternal;
    if (template.imagem_url && bridge?.shareWhatsAppImage) {
      bridge.shareWhatsAppImage(phone, message, template.imagem_url);
    } else {
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }
    setIsMessageOpen(false);"""
          if old not in s:
              raise SystemExit('handleSendMessage de vencidos não encontrado')
          s = s.replace(old, new, 1)

          old = """  function sendRenewalMessage() {
    if (!selectedClient?.whatsapp || !selectedClient?.vencimento) { toast.error('Cliente sem WhatsApp cadastrado.'); return; }
    const firstName = (selectedClient.nome || 'Cliente').trim().split(' ')[0] || 'Cliente';
    const brDate = format(parseISO(selectedClient.vencimento), 'dd/MM/yyyy');
    const message = BOT_TEMPLATES.CONFIRMACAO(firstName, brDate);
    const phoneRaw = selectedClient.whatsapp.replace(/\\D/g, '');
    const phone = phoneRaw.startsWith('55') ? phoneRaw : `55${phoneRaw}`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    setIsRenewSuccessOpen(false);
  }"""
          new = """  async function sendRenewalMessage() {
    if (!selectedClient?.whatsapp || !selectedClient?.vencimento) { toast.error('Cliente sem WhatsApp cadastrado.'); return; }
    const firstName = (selectedClient.nome || 'Cliente').trim().split(' ')[0] || 'Cliente';
    const brDate = format(parseISO(selectedClient.vencimento), 'dd/MM/yyyy');
    const phoneRaw = selectedClient.whatsapp.replace(/\\D/g, '');
    const phone = phoneRaw.startsWith('55') ? phoneRaw : `55${phoneRaw}`;
    let message = BOT_TEMPLATES.CONFIRMACAO(firstName, brDate);
    let imageUrl: string | null = null;
    try {
      const { data } = await supabase.from('templates_whatsapp' as any).select('nome,mensagem,imagem_url,system');
      const list = (data ?? []) as any[];
      const template = list.find(t => t.system === 'renovacao' || /renov|confirm|sucesso/i.test(String(t.nome || '')));
      if (template) {
        message = String(template.mensagem || message)
          .replace(/{nome}/g, selectedClient.nome || firstName)
          .replace(/{primeiro_nome}/g, firstName)
          .replace(/{vencimento}/g, brDate)
          .replace(/{valor}/g, `R$ ${Math.max(0, Number(selectedClient.plans?.price || 0) - Number(selectedClient.desconto || 0)).toFixed(2)}`);
        imageUrl = template.imagem_url || null;
      }
    } catch (error) {
      console.warn('Falha ao carregar template de renovação; usando texto padrão.', error);
    }
    const bridge = (window as any).OwerAppsExternal;
    if (imageUrl && bridge?.shareWhatsAppImage) {
      bridge.shareWhatsAppImage(phone, message, imageUrl);
    } else {
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }
    setIsRenewSuccessOpen(false);
  }"""
          if old not in s:
              raise SystemExit('sendRenewalMessage de vencidos não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate
        run: bun install --frozen-lockfile && bun run build
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/vencidos.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: enviar imagens dos templates em clientes vencidos"
          git push
