name: Fix vencidos WhatsApp data

on:
  push:
    paths:
      - '.github/workflows/fix-vencidos-whatsapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve expired client WhatsApp data
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/dashboard.tsx')
          s = p.read_text()
          old = 'vencidos:vencidos.map(c=>({id:c.id,nome:c.nome,status:c.status,valor:c.valor,vencimento:c.vencimento}))'
          new = 'vencidos:vencidos.map(c=>({...c,valorFinal:Number(c.valor??0),serverName:(c.servidores_ids||[]).map((id:string)=>servers.find(s=>s.id===id)?.name).filter(Boolean).join(", ")||"Painel"}))'
          if old not in s:
              raise SystemExit('Mapeamento esperado de clientes vencidos não encontrado')
          p.write_text(s.replace(old, new, 1))
      - name: Validate
        run: npm install --ignore-scripts && npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: enviar cobrança com imagem para clientes vencidos"
          git push
